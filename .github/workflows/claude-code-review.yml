name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# Nothing by default; the job below asks only for what the action needs.
permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip drafts and Dependabot. Fork PRs are skipped as well: GitHub does not
    # pass secrets to pull_request runs from forks, so the action could not
    # authenticate there.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # post the review comments
      id-token: write # OIDC exchange for the Claude GitHub App token
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in
            the current working directory. Read AGENTS.md first: it defines
            the project's conventions, and findings that break them matter
            most. In particular:
            - A feed that cannot be read must become UNKNOWN with an error,
              never OK; parsers raise on unexpected shapes instead of
              returning empty data; unsupported data uses the supports_*
              flags.
            - Exit codes are part of the interface: 0 all feeds read, 1 any
              feed unreadable, 2 bad arguments.
            - Responses are hostile input: defusedxml only, every read goes
              through _read with its size and time limits, https:// URLs only.

            Look for, in this order:
            1. Correctness bugs, including anything that could produce a
               false "all clear".
            2. Security problems.
            3. Test gaps: changed behaviour without a test, fixtures edited
               by hand, assertions that depend on the current time, new
               providers missing the steps AGENTS.md lists.

            Be concise. Report only real problems, not style nits (ruff
            enforces style) or praise. Use
            `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) for each specific issue, on the relevant line.
            Then post one short summary with `gh pr comment`; if you found
            nothing worth raising, say so in one line. Only post GitHub
            comments; don't submit review text as messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
