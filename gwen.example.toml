# Copy to gwen.toml and trim to what you actually depend on.
# Every key is optional; without this file GWEN covers all built-in providers.

# Providers used by every command when none is named on the command line.
# Built in: cloudflare, aws, azure, gcp, github, datadog, atlassian.
providers = ["cloudflare", "aws", "azure", "github", "twilio"]

# Any other vendor that runs Atlassian Statuspage (has /api/v2/summary.json).
[[statuspage]]
key = "twilio"
label = "Twilio"
url = "https://status.twilio.com"

# To check one region instead of a whole provider, name it on the command
# line: gwen status azure/scus, gwen incidents aws/us-east-1.
# 'gwen regions azure' lists the names it understands.
