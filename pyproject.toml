[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gwen-cli"
version = "2.0.0"
description = "Cloud status monitor - track Cloudflare, AWS, Azure, GCP, GitHub, Datadog, and Atlassian from the terminal"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "GWEN Contributors"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "aiohttp>=3.9.0",
    "rich>=13.0.0",
    "defusedxml>=0.7.1",
    "tomli>=2.0.0; python_version < '3.11'",
]

# Dev dependencies are declared twice on purpose: `dependency-groups` is what
# `uv sync` and `uv run` pick up automatically, and the extra keeps
# `pip install -e ".[dev]"` working for anyone not using uv. Keep them in step.
[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.15",
    "mypy>=1.10",
    "types-defusedxml",
    "trustme>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.15",
    "mypy>=1.10",
    "types-defusedxml",
    "trustme>=1.1",
]

[project.urls]
Homepage = "https://github.com/canozagrada/gwen-cli"
Repository = "https://github.com/canozagrada/gwen-cli"
Issues = "https://github.com/canozagrada/gwen-cli/issues"

[project.scripts]
gwen = "gwen_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests need network access and someone else's uptime, so they are
# opt-in: run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: checks the real vendor endpoints (requires network)"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Markdown code blocks are illustrative snippets, not modules to reformat.
extend-exclude = ["*.md", ".claude/worktrees"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["gwen_cli"]
known-local-folder = ["conftest"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# Only installed on Python < 3.11, where it stands in for tomllib.
module = ["tomli"]
ignore_missing_imports = true
